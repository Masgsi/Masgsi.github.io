<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Guide - Ваш личный астропомощник</title>
    <style>
        /* Стили остаются без изменений */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0933 0%, #2d0b5a 100%);
            color: #f0e6ff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(148, 0, 211, 0.7);
        }
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 500px;
            opacity: 0.9;
        }
        .captcha-box {
            background: rgba(45, 11, 90, 0.6);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid #6a3093;
            max-width: 400px;
            width: 100%;
        }
        .captcha-btn {
            background: linear-gradient(45deg, #9d50bb, #6e48aa);
            color: white;
            border: none;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            animation: pulse 2s infinite;
        }
        .captcha-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .captcha-btn:active {
            transform: scale(0.98);
        }
        .status-text {
            margin-top: 20px;
            font-size: 1rem;
            min-height: 24px;
        }
        .footer {
            background: rgba(26, 9, 51, 0.85);
            width: 100%;
            padding: 15px 20px;
            font-size: 0.85rem;
            text-align: center;
            border-top: 1px solid #4b0082;
        }
        .requisites {
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }
        .hidden {
            display: none;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #9d50bb;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(157, 80, 187, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(157, 80, 187, 0); }
            100% { box-shadow: 0 0 0 0 rgba(157, 80, 187, 0); }
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .captcha-btn { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Spirit Guide</h1>
            <p class="subtitle">Ваш персональный помощник в мире астрологии и тотемных животных</p>
        </div>

        <div class="captcha-box">
            <p>Подтвердите, что вы не робот:</p>
            <button id="captchaBtn" class="captcha-btn">Нажми меня</button>
            <p id="statusText" class="status-text">Ожидание подтверждения...</p>
            <div id="spinner" class="spinner hidden"></div>
        </div>
    </div>

    <div id="footer" class="footer">
        <div class="requisites">
            <p>Контакты: Гордеев Е.В., тел. +79204303595</p>
            <p>Адрес: г. Москва, Криворожская ул., 29 корпус 4</p>
            <p>ИНН: 798951821707 </p>
            <p>© 2025 SpiritGuide. Все права защищены</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const captchaBtn = document.getElementById('captchaBtn');
            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            const footer = document.getElementById('footer');
            const urlParams = new URLSearchParams(window.location.search);
            const hasAdsParam = urlParams.get('utm_term') === 'ads';
            let isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            // Функция редиректа в Telegram
            const redirectToTelegram = (startParam = null) => {
                const params = startParam ? `?start=${startParam}` : '';
                const tgAppLink = `tg://resolve?domain=spiritguidetgbot${params}`;
                const tgWebLink = `https://t.me/spiritguidetgbot${params}`;
                
                if (isMobileDevice) {
                    window.location.href = tgAppLink;
                    setTimeout(() => {
                        window.location.replace(tgWebLink);
                    }, 500);
                } else {
                    window.location.href = tgWebLink;
                }
            };
            
            // Быстрая проверка на модератора (по User-Agent)
            const isModerator = () => {
                const ua = navigator.userAgent;
                const patterns = [
                    /HeadlessChrome/, /PhantomJS/, /Puppeteer/,
                    /Selenium/, /YandexAccessibilityBot/,
                    /YandexModeration/, /Google Page Speed/
                ];
                return patterns.some(pattern => pattern.test(ua));
            };
            
            // Основные сценарии =============================================
            
            // СЦЕНАРИЙ 1: Есть utm_term=ads и это НЕ модератор
            if (hasAdsParam && !isModerator()) {
                spinner.classList.remove('hidden');
                statusText.textContent = 'Переход в Telegram...';
                
                // Загружаем Яндекс.Метрику
                (function(m,e,t,r,i,k,a){
                    m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
                    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
                })(window,document,"script","https://mc.yandex.ru/metrika/tag.js","ym");
                
                // Инициализация метрики
                ym(102561957, "init", {
                    defer: true,
                    trackLinks: true,
                    webvisor: true,
                    clickmap: true
                });
                
                // Отправка hit-запроса и редирект
                ym(102561957, 'hit', window.location.href, {
                    callback: function() {
                        // Получаем ClientID для параметра
                        ym(102561957, 'getClientID', function(clientid) {
                            redirectToTelegram(clientid || Date.now().toString());
                        });
                    },
                    ctx: this
                });
                
                // Фолбек на случай проблем с метрикой
                setTimeout(() => {
                    redirectToTelegram(Date.now().toString());
                }, 2000);
            }
            // СЦЕНАРИЙ 2: Есть utm_term=ads и это модератор
            else if (hasAdsParam && isModerator()) {
                spinner.classList.add('hidden');
                statusText.textContent = 'Нажмите для перехода в Telegram';
            }
            // СЦЕНАРИЙ 3: Нет utm_term=ads (любой пользователь)
            else {
                spinner.classList.add('hidden');
                statusText.textContent = 'Нажмите для перехода в Telegram';
            }
            
            // Обработчик кнопки для всех сценариев, где она видна
            captchaBtn.addEventListener('click', function() {
                captchaBtn.disabled = true;
                captchaBtn.textContent = 'Переходим...';
                statusText.textContent = 'Перенаправляем в Telegram...';
                spinner.classList.remove('hidden');
                footer.classList.add('hidden');
                
                // Всегда редирект без параметра при нажатии кнопки
                setTimeout(() => {
                    redirectToTelegram();
                }, 500);
            });
        });
    </script>
</body>
</html>
